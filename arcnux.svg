<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <g fill="none" stroke-linecap="round">
    <!-- Orange half (left side) -->
    <g stroke="#f08a3a">
      <circle cx="50" cy="50" r="38" stroke-width="3" stroke-dasharray="3 5" stroke-dashoffset="0" transform="rotate(-90 50 50)" pathLength="100" stroke-dashoffset="0" style="stroke-dasharray: 4 7;"/>
      <circle cx="50" cy="50" r="30" stroke-width="2.5" stroke-dasharray="2 4" transform="rotate(-90 50 50)"/>
      <circle cx="50" cy="50" r="22" stroke-width="2" stroke-dasharray="1.5 3" transform="rotate(-90 50 50)"/>
    </g>
    <!-- Mask to make right half black -->
    <defs>
      <clipPath id="rightHalf">
        <rect x="50" y="0" width="50" height="100"/>
      </clipPath>
      <clipPath id="leftHalf">
        <rect x="0" y="0" width="50" height="100"/>
      </clipPath>
    </defs>
    <g stroke="#1a1a1a" clip-path="url(#rightHalf)">
      <circle cx="50" cy="50" r="38" stroke-width="3" stroke-dasharray="4 7" transform="rotate(-90 50 50)"/>
      <circle cx="50" cy="50" r="30" stroke-width="2.5" stroke-dasharray="2 4" transform="rotate(-90 50 50)"/>
      <circle cx="50" cy="50" r="22" stroke-width="2" stroke-dasharray="1.5 3" transform="rotate(-90 50 50)"/>
    </g>
  </g>
</svg>
