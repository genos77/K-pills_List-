<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="K-Pill's">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<title>K-Pill's 2016 Again — Guest List</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="header">
  <div id="powered-by">
    powered by
    <img class="arcnux-mark" src="arcnux.svg" alt="">
    <span class="arcnux-name">Arcnux</span>
  </div>
  <div id="top-row">
    <img id="logo" src="logo.jpg" alt="K-Pill's 2016 Again">
    <div id="title-block">
      <div id="label">SAT · 06.06</div>
      <div id="title">K-PILL'S</div>
      <div id="subtitle">2016 AGAIN</div>
    </div>
    <div id="counter">
      <div id="count-num">0</div>
      <div id="count-label">/ <span id="total-count">0</span> IN</div>
    </div>
  </div>
  <div id="tagline">Straight out of your old 9XM playlist</div>
  <div id="search-wrap">
    <input id="search" type="text" placeholder="Search name..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button id="clear-btn">×</button>
  </div>
  <div id="filter-tabs">
    <button class="tab active" data-filter="all">ALL</button>
    <button class="tab" data-filter="in">IN</button>
    <button class="tab" data-filter="out">OUT</button>
  </div>
  <div id="status-row">
    <div id="sync-status"><span id="sync-dot"></span><span id="sync-text">ready</span></div>
    <div id="result-count"></div>
  </div>
</div>

<div id="error-banner"></div>
<div id="list"></div>
<div id="empty">NOT ON THE LIST</div>

<div id="add-bar">
  <input id="add-input" type="text" placeholder="Add name(s), separate with commas..." autocomplete="off" autocapitalize="words" spellcheck="false">
  <button id="add-btn">ADD</button>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
